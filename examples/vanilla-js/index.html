<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻简思维导图 SDK 示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
            padding: 32px 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .header h1 span {
            color: #f54648;
        }
        .header .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .header .actions .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn-primary {
            background: #f54648;
            color: #fff;
        }
        .btn-primary:hover {
            background: #dc3d3f;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245, 70, 72, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            color: #f54648;
            border: 1px solid #f54648;
        }
        .btn-outline:hover {
            background: #fef0ee;
        }

        .sdk-wrapper {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }
        .sdk-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 12px;
        }
        .sdk-toolbar .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }
        .sdk-toolbar .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .sdk-toolbar .status .dot.loading {
            background: #ffa726;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .sdk-toolbar .status .dot.ready {
            background: #4caf50;
        }
        .sdk-toolbar .status .dot.error {
            background: #ef5350;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        .sdk-iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #0b0b0e;
        }
        .sdk-iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer-info {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: #888;
        }
        .footer-info a {
            color: #f54648;
            text-decoration: none;
        }
        .footer-info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
            .header h1 {
                font-size: 22px;
            }
            .sdk-toolbar {
                padding: 12px 16px;
            }
            .header .actions .badge {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🧠 寻简 <span>思维导图</span></h1>
            <div class="actions">
                <span class="badge">⚡ SDK 示例</span>
                <!-- ✅ 新增：申请 API Key 引导按钮 -->
                <a href="https://www.mindyushu.com/api.html" target="_blank" class="btn btn-primary">
                    🔑 申请 API Key
                </a>
            </div>
        </div>

        <div class="sdk-wrapper">
            <div class="sdk-toolbar">
                <div class="status">
                    <span class="dot loading" id="statusDot"></span>
                    <span id="statusText">加载中...</span>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-primary" id="reloadBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        重新渲染
                    </button>
                </div>
            </div>

            <div class="sdk-iframe-container">
                <iframe
                    id="mindmap-sdk"
                    src="https://web.mindyushu.com/sdk"
                    allow="clipboard-write"
                ></iframe>
            </div>
        </div>

        <div class="footer-info">
            <span>
                📖 <a href="https://www.mindyushu.com/api.html" target="_blank">完整文档</a>
                &nbsp;·&nbsp; 💬 <a href="https://www.mindyushu.com/contact.html" target="_blank">联系我们</a>
            </span>
            <span>
                🔑 <a href="https://www.mindyushu.com/api.html" target="_blank" style="font-weight:500;">申请 API Key</a>
                &nbsp;·&nbsp; 请替换代码中的 <code style="background:#f0f0f0;padding:1px 6px;border-radius:4px;font-size:12px;">YOUR_API_KEY</code>
            </span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== ⚠️ 请替换为你在寻简开放平台申请的 API Key =====
            // 申请地址: https://www.mindyushu.com/api.html
            const API_KEY = 'mkmqEK31NDxcuTsWV4bHDds3mOONd3ML5V8fH3D9cYk=';

            // ===== DOM 引用 =====
            const iframe = document.getElementById('mindmap-sdk');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const reloadBtn = document.getElementById('reloadBtn');

            let isSDKReady = false;
            let pendingData = null;

            function setStatus(type, message) {
                statusDot.className = 'dot ' + type;
                statusText.textContent = message;
            }

            // ===== 构建示例数据 =====
            function buildSDKData() {
                return {
                    ApiKey: API_KEY,
                    rootNode: {
                        value: {
                            text: "SDK介绍\n寻简思维导图",
                            textColor: 16777215,
                            textFontSize: 22,
                            backgroundColor: 0,
                            backgroundColorAlpha: 1,
                            borderColor: 0,
                            borderWidth: 2,
                            mindElementShape: 0,
                            alignmentType: 1,
                            styleCells: [
                                {
                                    startIndex: 5,
                                    endIndex: 14,
                                    textFontSize: 16
                                },
                                {
                                    startIndex: 0,
                                    endIndex: 3,
                                    textFontSize: 32,
                                    textColor: 16770432,
                                    textBold: true
                                }
                            ]
                        },
                        children: [
                            {
                                value: {
                                    text: "快速集成",
                                    textColor: 16777215,
                                    textFontSize: 16,
                                    backgroundColor: 14434048,
                                    backgroundColorAlpha: 1,
                                    mindElementShape: 0
                                },
                                children: [
                                    { value: { text: "iframe 嵌入", textFontSize: 14 }, children: [] },
                                    { value: { text: "postMessage 通信", textFontSize: 14 }, children: [] },
                                    { value: { text: "READY 事件监听", textFontSize: 14 }, children: [] }
                                ]
                            },
                            {
                                value: {
                                    text: "数据结构",
                                    textColor: 15658734,
                                    textFontSize: 16,
                                    backgroundColor: 4860506,
                                    backgroundColorAlpha: 1,
                                    mindElementShape: 0
                                },
                                children: [
                                    { value: { text: "SDKDatas", textFontSize: 14 }, children: [] },
                                    { value: { text: "节点树 (rootNode)", textFontSize: 14 }, children: [] },
                                    { value: { text: "MindmapSDKSubjectData", textFontSize: 14 }, children: [] }
                                ]
                            },
                            {
                                value: {
                                    text: "样式定制",
                                    textColor: 15658734,
                                    textFontSize: 16,
                                    backgroundColor: 2771514,
                                    backgroundColorAlpha: 1,
                                    mindElementShape: 0
                                },
                                children: [
                                    { value: { text: "30+ 种骨架布局", textFontSize: 14 }, children: [] },
                                    { value: { text: "30 种配色方案", textFontSize: 14 }, children: [] },
                                    { value: { text: "节点形状自定义", textFontSize: 14 }, children: [] }
                                ]
                            },
                            {
                                value: {
                                    text: "导出与交互",
                                    textColor: 15658734,
                                    textFontSize: 16,
                                    backgroundColor: 5909034,
                                    backgroundColorAlpha: 1,
                                    mindElementShape: 0
                                },
                                children: [
                                    { value: { text: "保存为图片", textFontSize: 14 }, children: [] },
                                    { value: { text: "点击事件响应", textFontSize: 14 }, children: [] }
                                ]
                            }
                        ]
                    },
                    styleIndex: 5,
                    frameworkIndex: 0,
                    lineWidth: 2.5,
                    lineLayout: 1,
                    layout: 19,
                    mindType: 1,
                    mindBGColor: 16777215,
                    showSaveImageButton: true,
                    lineColors: [
                        16724736,
                        14434048,
                        2236962,
                        3355443,
                        5909034,
                        5592405,
                        0,
                        1118481,
                        2236962,
                        3355443,
                        4473924,
                        5592405
                    ]
                };
            }

            // ===== 发送数据给 SDK =====
            function sendDataToSDK(data) {
                if (!iframe || !iframe.contentWindow) {
                    setStatus('error', 'iframe 未找到');
                    return;
                }

                if (!isSDKReady) {
                    pendingData = data;
                    setStatus('loading', 'SDK 未就绪，等待...');
                    return;
                }

                try {
                    iframe.contentWindow.postMessage({
                        type: 'MINDMAP',
                        data: JSON.stringify(data)
                    }, 'https://web.mindyushu.com');
                    setStatus('ready', '✅ 数据已发送');
                } catch (e) {
                    console.error('发送数据失败:', e);
                    setStatus('error', '❌ 发送失败');
                }
            }

            function sendTestData() {
                if (!API_KEY || API_KEY === 'YOUR_API_KEY') {
                    setStatus('error', '⚠️ 请先替换 YOUR_API_KEY');
                    // 在状态中显示申请链接（文字无法加链接，我们在下方单独提示）
                    return;
                }
                const data = buildSDKData();
                sendDataToSDK(data);
            }

            function handleMessage(event) {
                if (event.origin !== 'https://web.mindyushu.com') return;
                if (event.source !== iframe.contentWindow) return;

                const data = event.data;
                if (data.type === 'READY' && data.value === 'OK') {
                    isSDKReady = true;
                    setStatus('ready', '✅ SDK 已就绪');

                    if (pendingData) {
                        sendDataToSDK(pendingData);
                        pendingData = null;
                    } else {
                        sendTestData();
                    }
                }
            }

            function init() {
                if (!API_KEY || API_KEY === 'YOUR_API_KEY') {
                    setStatus('error', '⚠️ 请先设置 API Key');
                    // 引导用户去申请
                    console.warn('请前往 https://www.mindyushu.com/api.html 申请 API Key');
                    return;
                }

                setStatus('loading', '⏳ 加载 SDK...');
                window.addEventListener('message', handleMessage);

                setTimeout(() => {
                    if (!isSDKReady) {
                        try {
                            iframe.contentWindow.postMessage({ type: 'PING' }, 'https://web.mindyushu.com');
                        } catch (e) {}
                        setTimeout(() => {
                            if (!isSDKReady) {
                                setStatus('loading', '⏳ 尝试直接发送...');
                                sendTestData();
                            }
                        }, 3000);
                    }
                }, 5000);
            }

            reloadBtn.addEventListener('click', function() {
                setStatus('loading', '🔄 重新渲染...');
                if (isSDKReady) {
                    sendTestData();
                } else {
                    pendingData = buildSDKData();
                    try {
                        iframe.contentWindow.postMessage({ type: 'PING' }, 'https://web.mindyushu.com');
                    } catch (e) {}
                    setStatus('loading', '⏳ 等待 SDK 就绪...');
                }
            });

            if (iframe) {
                if (iframe.contentWindow) {
                    init();
                } else {
                    iframe.addEventListener('load', init);
                }
            }

            console.log('🧠 寻简思维导图 SDK 示例已启动');
            console.log('🔑 申请 API Key: https://www.mindyushu.com/api.html');

        })();
    </script>

</body>
</html>
